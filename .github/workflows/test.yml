name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generated files are up to date and contrast holds
        run: python3 generate.py --check
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
